services:
  backend:
    image: ghcr.io/yremancer/nibble_back:${BACK_VERSION:-latest}
    networks:
      - base
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/zetlock17/nibble-frontend:${FRONT_VERSION:-latest}
    networks:
      - base
    restart: unless-stopped

  db:
    image: postgres
    networks:
      - base
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./dumps:/docker-entrypoint-initdb.d
      - ./dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    pull_policy: never
    command: server /data --console-address :9001
    networks:
      - base
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SITE_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    pull_policy: never
    networks:
      - base
    env_file: .env
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./minio/setup.sh:/setup.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:alpine
    networks:
      - base
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:

networks:
  base:
    driver: bridge
