services:
  backend:
    image: ghcr.io/yremancer/nibble_back:${BACK_VERSION:-latest}
    networks:
      - base
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/zetlock17/nibble-frontend:${FRONT_VERSION:-latest}
    networks:
      - base
    restart: unless-stopped

  db:
    image: postgres
    networks:
      - base
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./dumps:/docker-entrypoint-initdb.d
      - ./dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 30

  nginx:
    image: nginx:alpine
    networks:
      - base
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:

networks:
  base:
    driver: bridge
